[project]
name = "doc-scan-pdf-editor"
version = "0.1.0"
description = "Offline document scanner and PDF editor: scan, straighten, enhance, OCR, annotate, export."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Olivier Lestang" }]
keywords = ["pdf", "scanner", "ocr", "offline", "annotation", "document"]
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "platformdirs>=4.3",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docscanner"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "ANN", "UP", "B", "SIM", "RUF"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["docscanner"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["docscanner"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "numpy",
    "numpy.*",
    "PIL",
    "PIL.*",
    "pypdfium2",
    "pypdfium2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
