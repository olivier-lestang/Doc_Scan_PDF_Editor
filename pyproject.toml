[project]
name = "lestang-pdf-editor"
version = "0.1.0"
description = "Offline document scanner and PDF editor: scan, straighten, enhance, OCR, annotate, export."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Olivier Lestang" }]
keywords = ["pdf", "scanner", "ocr", "offline", "annotation", "document"]
dependencies = [
    "cryptography>=43",  # AES-256 PDF encryption (Apache-2.0/BSD), used by pypdf
    "flet==0.28.3",
    "langdetect>=1.0.9",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=10.4",
    "platformdirs>=4.3",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
]

[project.scripts]
lestang_pdf_editor = "lestang_pdf_editor.app.main:cli"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Exact-pinned Flutter runtime packages for desktop/web runs and packaging.
# They are NOT in the app lock's runtime deps on purpose (heavy binaries);
# install them with: uv sync --frozen --group desktop
desktop = [
    "flet-cli==0.28.3",
    "flet-web==0.28.3",
    "fastapi==0.115.6",
    "flet-desktop==0.28.3; sys_platform == 'win32' or sys_platform == 'darwin'",
    "flet-desktop-light==0.28.3; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lestang_pdf_editor"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D", "ANN", "UP", "B", "SIM", "RUF"]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["lestang_pdf_editor"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["lestang_pdf_editor"]

[[tool.mypy.overrides]]
module = [
    "cv2",
    "cv2.*",
    "flet",
    "flet.*",
    "langdetect",
    "langdetect.*",
    "numpy",
    "numpy.*",
    "PIL",
    "PIL.*",
    "pypdfium2",
    "pypdfium2.*",
    "rapidocr_onnxruntime",
    "rapidocr_onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
